# /etc/nginx/sites-available/amorz
#
# ریورس پروکسی برای اپلیکیشن Next.js پشت کلادفلر.
# پس از کپی:
#   ln -sf /etc/nginx/sites-available/amorz /etc/nginx/sites-enabled/amorz
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

# ---------- IP واقعی بازدیدکننده از هدر کلادفلر ----------
# بدون این بخش، همه لاگ‌ها و rate limitها IP کلادفلر را می‌بینند.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# محدودیت نرخ روی مسیر ورود پنل — جلوگیری از حدس رمز
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;

upstream amorz_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- هر چیزی جز دامنه اصلی روی HTTPS ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://amorz.ir$request_uri;
}

# ---------- ریدایرکت www به بدون www ----------
server {
    # روی Ubuntu 24.04 نسخه nginx برابر 1.24 است و دستور «http2 on;» را نمی‌شناسد،
    # پس http2 روی خود listen تعریف می‌شود (روی نسخه‌های جدیدتر هم کار می‌کند).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.amorz.ir;

    ssl_certificate     /etc/ssl/cloudflare/amorz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/amorz.key;

    return 301 https://amorz.ir$request_uri;
}

# ---------- سرور اصلی ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amorz.ir;

    ssl_certificate     /etc/ssl/cloudflare/amorz.pem;
    ssl_certificate_key /etc/ssl/cloudflare/amorz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/amorz/public;

    # حجم مجاز آپلود تصویر پنل (سقف خود اپلیکیشن ۵ مگابایت است)
    client_max_body_size 12m;

    # فشرده‌سازی — کلادفلر هم فشرده می‌کند ولی این برای ارتباط با origin مفید است
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    access_log /var/log/nginx/amorz.access.log;
    error_log  /var/log/nginx/amorz.error.log warn;

    # ---------- دارایی‌های ساخته‌شده Next: هش‌دار و همیشگی ----------
    location /_next/static/ {
        alias /var/www/amorz/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- تصاویر و فایل‌های ثابت ----------
    location /images/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    # تصاویر آپلودشده از پنل
    # اگر Nginx به هر دلیلی فایل را نبیند (دسترسی پوشه، آپلود تازه)، درخواست به
    # اپلیکیشن می‌رود تا خودش از public/ سرو کند — به‌جای اینکه تصویر خراب شود.
    location /uploads/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        # اجرای هیچ اسکریپتی از این پوشه مجاز نیست
        location ~* \.(php|js|mjs|sh|py)$ { deny all; }
        try_files $uri @app;
    }

    location = /favicon.svg { expires 30d; access_log off; try_files $uri @app; }
    location = /robots.txt {
        proxy_pass http://amorz_app;
        include /etc/nginx/proxy-amorz.conf;
    }

    # ---------- محدودیت نرخ روی ورود پنل ----------
    location = /admin/login {
        limit_req zone=adminlogin burst=5 nodelay;
        proxy_pass http://amorz_app;
        include /etc/nginx/proxy-amorz.conf;
    }

    # ---------- بقیه درخواست‌ها به اپلیکیشن ----------
    location / {
        proxy_pass http://amorz_app;
        include /etc/nginx/proxy-amorz.conf;
    }

    location @app {
        proxy_pass http://amorz_app;
        include /etc/nginx/proxy-amorz.conf;
    }
}
